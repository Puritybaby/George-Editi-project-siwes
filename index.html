<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>George Editi SIWES Project</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#222}
header{background:linear-gradient(90deg,#0a3d62,#079992);color:#fff;padding:35px 20px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:8px 0 0}
nav{background:#fff;position:sticky;top:0;z-index:99;display:flex;gap:10px;overflow:auto;padding:12px;border-bottom:1px solid #ddd}
nav a{padding:8px 14px;background:#0a3d62;color:#fff;border-radius:20px;text-decoration:none;white-space:nowrap;font-size:13px}
section{max-width:900px;margin:20px auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
h2{color:#0a3d62;border-left:5px solid #079992;padding-left:12px}
h3{color:#079992}
.cover{text-align:center}
.cover h1{font-size:32px;color:#0a3d62}
.btn{display:inline-block;padding:12px 20px;background:#0a3d62;color:#fff;border-radius:8px;text-decoration:none;margin-top:10px}
ul{line-height:1.8}
footer{text-align:center;padding:25px;background:#0a3d62;color:#fff;margin-top:30px}
@media print{nav{display:none}}
</style>
</head>
